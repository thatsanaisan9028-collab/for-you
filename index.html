<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ชื่อล่อซื้อ เลือกเปลี่ยนตรงนี้ให้เนียนที่สุด -->
    <title>ไฟล์งานสำคัญ.pdf (ด่วน!) - OneDrive</title>
    <!-- <title>รูปหลุดเธอ! (ดูด่วนก่อนลบ)</title> -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            flex-direction: column;
        }

        /* หน้าโหลดปลอมๆ ให้ดูเหมือนกำลังโหลดไฟล์ */
        .loading-screen {
            text-align: center;
            z-index: 10;
        }
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: #555; font-size: 1.1rem; }

        /* หน้าเฉลยตอนจบ (ซ่อนไว้ก่อน) */
        .reveal-screen {
            display: none;
            text-align: center;
            animation: popIn 0.5s ease;
            z-index: 5;
        }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        /* ใส่ URL รูปมีมตลกๆ ตรงนี้ (หรือใช้รูปแมวกวนๆ ที่ผมใส่ไว้) */
        .meme-img {
            max-width: 300px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .reveal-text {
            color: #2c3e50;
            font-size: 2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- หน้าโหลดปลอม -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loader"></div>
        <p class="loading-text">กำลังโหลดไฟล์... กรุณารอครู่</p>
    </div>

    <!-- หน้าเฉลย -->
    <div class="reveal-screen" id="revealScreen">
        <!-- รูปมีมแมวกวนๆ (เปลี่ยน URL เป็นรูปอื่นได้ตามใจชอบ) -->
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcjN6OXE1ZnU1NXF3NTAwN3pxb3FnazVyamxwaWpzeDZ6NnF2eGszcyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/C9x8gX02SnMIo/giphy.gif" alt="Meme" class="meme-img">
        <p class="reveal-text">ก๊ากกก! โดนแกล้งแล้ว! 🤪</p>
    </div>

    <script>
        // ฟังก์ชันเริ่มแกล้ง
        function startPrank() {
            // ลำดับ Popup ข้อความกวนๆ (เพิ่ม/ลดได้)
            alert("⚠️ คำเตือน: เครื่องคุณกำลังจะระเบิด!");
            alert("ล้อเล่น... เครื่องคุณติดไวรัสหัวใจ!");
            alert("กรุณากด OK เพื่อยืนยันว่าคุณหน้าตาดีกว่าคนส่ง...");
            alert("อุ๊ย! กด OK อีกทีสิ");
            alert("ครั้งสุดท้ายแล้ว... จริงๆ นะ");
            alert("ก๊ากกกก! เชื่อคนง่ายจัง!");

            // เฉลย
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('revealScreen').style.display = 'block';

            // เปิดเสียงหัวเราะกวนๆ (เสียง default ของ browser)
            // หมายเหตุ: บาง browser อาจบล็อกเสียงถ้าผู้ใช้ยังไม่ได้ปฏิสัมพันธ์กับหน้าเว็บ
            const audio = new Audio('https://www.soundjay.com/human/laughter-2.mp3'); 
            // หรือใช้ URL เสียงกวนๆ อื่นๆ เช่นเสียงเป็ด, เสียงขำกวนๆ
            audio.play().catch(e => console.log("Audio play blocked by browser."));
        }

        // เริ่มแกล้งหลังจากโหลดหน้าเว็บเสร็จ 2 วินาที (ให้ดูเนียนๆ)
        window.onload = function() {
            setTimeout(startPrank, 2000); 
        };
    </script>
</body>
</html>

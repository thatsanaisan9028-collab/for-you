<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You Heart</title>
    <style>
        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .heart-container {
            position: relative;
            width: 350px;
            height: 350px;
        }

        .text {
            position: absolute;
            color: #ff69b4; /* สีชมพู */
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
            text-shadow: 0 0 8px #ff1493, 0 0 15px #ff69b4; /* แสงเรืองรองสีชมพู */
            animation: pulse 2s infinite ease-in-out;
        }

        /* เอฟเฟกต์หัวใจเต้นวิบวับ */
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.9;
            }
            50% {
                transform: scale(1.05);
                opacity: 1;
                text-shadow: 0 0 12px #ff1493, 0 0 25px #ff69b4;
            }
        }
    </style>
</head>
<body>

    <div class="heart-container" id="heart"></div>

    <script>
        const heartContainer = document.getElementById('heart');
        const textPhrase = "i love you";
        const totalPoints = 40; // จำนวนข้อความที่จะนำมาต่อเป็นรูปหัวใจ

        // สมการคณิตศาสตร์สร้างรูปหัวใจ (Parametric Heart Equation)
        for (let i = 0; i < totalPoints; i++) {
            const t = (i / totalPoints) * Math.PI * 2;
            
            // สูตรตำแหน่ง X, Y ของรูปหัวใจ
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

            // ปรับขนาดและตำแหน่งให้อยู่ตรงกลาง
            const scale = 11;
            const posX = x * scale + 175;
            const posY = y * scale + 175;

            // สร้าง Element ข้อความ
            const span = document.createElement('span');
            span.className = 'text';
            span.innerText = textPhrase;
            span.style.left = `${posX}px`;
            span.style.top = `${posY}px`;

            // หมุนตัวอักษรให้เอียงตามเส้นโค้งของหัวใจ
            const angle = Math.atan2(y, x) * (180 / Math.PI);
            span.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;

            // สุ่มหน่วงเวลาลูกเล่นไฟกระพริบให้ดูมีมิติ
            span.style.animationDelay = `${(i / totalPoints) * 2}s`;

            heartContainer.appendChild(span);
        }
    </script>

</body>
</html>
